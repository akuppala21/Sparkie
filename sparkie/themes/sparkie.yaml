name: sparkie
label: Sparkie
description: Charcoal surfaces with green controls and system fonts.

layoutVariant: standard
layout:
  radius: "12px"
  density: comfortable

palette:
  background: "#0b0c0e"
  midground: "#e9ebee"
  foreground:
    hex: "#ffffff"
    alpha: 0
  warmGlow: "rgba(0, 0, 0, 0)"
  noiseOpacity: 0

typography:
  fontSans: 'ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif'
  fontMono: 'ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace'

colorOverrides:
  card: "#131518"
  cardForeground: "#e9ebee"
  popover: "#131518"
  popoverForeground: "#e9ebee"
  primary: "#76b900"
  primaryForeground: "#0b1400"
  secondary: "#22262b"
  secondaryForeground: "#e9ebee"
  muted: "#1a1d21"
  mutedForeground: "#a9b0b9"
  accent: "#222e16"
  accentForeground: "#92d400"
  border: "#2f343b"
  input: "#5d6570"
  ring: "#92d400"
  destructive: "#f2555a"
  destructiveForeground: "#0b0c0e"
  success: "#5cc26a"
  warning: "#e5a50a"

componentStyles:
  header:
    background: "var(--color-card)"
  card:
    background: "var(--color-card)"
    boxShadow: "0 1px 2px rgba(0, 0, 0, 0.4)"

# The pinned Nous UI solid Button uses bg-midground and Card has no radius
# prop. Keep disabled, outlined, ghost and destructive button variants native.
customCSS: |
  button.bg-midground:not(:disabled) {
    background-color: var(--color-primary);
    color: var(--color-primary-foreground);
    border-radius: var(--theme-radius);
    box-shadow: none;
    font-family: var(--theme-font-sans);
    letter-spacing: normal;
  }
  div[style*="--component-card-background"] {
    border-radius: var(--theme-radius);
  }
